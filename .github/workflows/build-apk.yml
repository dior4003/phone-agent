name: Build APK & Check Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write   # tegli build uchun GitHub Release yaratish huquqi

jobs:
  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server bog'liqliklari va testlari
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm test

  build:
    needs: server-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Yagona manba: server/package.json dagi "version" bilan GitHub tegi mosligini tekshiramiz.
      - name: Versiya mosligini tekshirish
        id: ver
        run: |
          PKG_VER=$(node -p "require('./server/package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG_VER" != "$PKG_VER" ]]; then
              echo "XATO: Git tegi ($TAG_VER) va server/package.json ($PKG_VER) versiyalari mos emas!"
              exit 1
            fi
            IS_RELEASE=true
          else
            IS_RELEASE=false
          fi
          echo "name=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Server va APK versiyasi: $PKG_VER (release: $IS_RELEASE)"

      - name: Build debug APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon

      - name: APK'ni versiya nomi bilan ko'chirish
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/phone-agent-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: phone-agent-${{ steps.ver.outputs.name }}
          path: dist/phone-agent-${{ steps.ver.outputs.name }}.apk

      # Faqat v1.2.3 kabi teg bilan push qilinganda: GitHub Release yaratib, APK'ni biriktiramiz
      - name: GitHub Release yaratish
        if: steps.ver.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Phone Agent v${{ steps.ver.outputs.name }}"
          files: dist/phone-agent-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
